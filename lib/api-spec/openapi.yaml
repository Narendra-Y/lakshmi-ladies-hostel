openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification for Lakshmi Ladies Hostel registration system
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Admin authentication
  - name: registrations
    description: Hostel registrations
  - name: uploads
    description: File uploads
  - name: stats
    description: Dashboard statistics
  - name: rooms
    description: Room and bed management
  - name: reminders
    description: Payment reminders
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: adminLogin
      tags: [auth]
      summary: Admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminLoginResult"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /auth/me:
    get:
      operationId: getAdminMe
      tags: [auth]
      summary: Get current admin
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current admin info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Admin"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /registrations:
    post:
      operationId: createRegistration
      tags: [registrations]
      summary: Submit a new registration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationInput"
      responses:
        "201":
          description: Registration submitted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Registration"
        "409":
          description: Phone number already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    get:
      operationId: listRegistrations
      tags: [registrations]
      summary: List all registrations (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, rejected]
        - name: search
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: List of registrations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationList"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /registrations/stats:
    get:
      operationId: getRegistrationStats
      tags: [stats]
      summary: Get registration statistics (admin only)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Dashboard statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationStats"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /registrations/reminders:
    get:
      operationId: getPaymentReminders
      tags: [reminders]
      summary: Get payment reminder list (admin only)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Payment reminders grouped by urgency
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemindersResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /registrations/{id}:
    get:
      operationId: getRegistration
      tags: [registrations]
      summary: Get a single registration (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Registration details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Registration"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteRegistration
      tags: [registrations]
      summary: Delete a registration (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /registrations/{id}/status:
    patch:
      operationId: updateRegistrationStatus
      tags: [registrations]
      summary: Approve or reject a registration (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusUpdate"
      responses:
        "200":
          description: Status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Registration"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /registrations/{id}/payment:
    patch:
      operationId: updatePaymentStatus
      tags: [registrations]
      summary: Update payment status (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentStatusUpdate"
      responses:
        "200":
          description: Payment status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Registration"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /uploads:
    post:
      operationId: uploadFile
      tags: [uploads]
      summary: Upload a file (photo or ID proof)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/FileUploadInput"
      responses:
        "200":
          description: File uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileUploadResult"
        "400":
          description: Invalid file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /qr:
    get:
      operationId: getQrCode
      tags: [registrations]
      summary: Get QR code for registration URL
      security:
        - bearerAuth: []
      responses:
        "200":
          description: QR code PNG as base64 and the registration URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QrCodeResult"

  /rooms:
    get:
      operationId: listRooms
      tags: [rooms]
      summary: List all rooms with bed occupancy (admin only)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of rooms with beds
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoomWithBeds"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: createRoom
      tags: [rooms]
      summary: Create a new room (admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoomInput"
      responses:
        "201":
          description: Room created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomWithBeds"
        "409":
          description: Room number already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /rooms/stats:
    get:
      operationId: getRoomStats
      tags: [rooms]
      summary: Get room occupancy statistics (admin only)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Occupancy statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomOccupancyStats"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /rooms/{roomId}:
    get:
      operationId: getRoom
      tags: [rooms]
      summary: Get room details with beds (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Room details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomWithBeds"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /rooms/beds/{bedId}/assign:
    patch:
      operationId: assignBed
      tags: [rooms]
      summary: Assign an approved tenant to a bed (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: bedId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignBedInput"
      responses:
        "200":
          description: Bed assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BedWithTenant"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Bed or tenant not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Bed already occupied or tenant already assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /rooms/beds/{bedId}/vacate:
    patch:
      operationId: vacateBed
      tags: [rooms]
      summary: Vacate a bed (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: bedId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Bed vacated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BedWithTenant"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /rooms/beds/{bedId}/transfer:
    patch:
      operationId: transferBed
      tags: [rooms]
      summary: Transfer tenant to a different bed (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: bedId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferBedInput"
      responses:
        "200":
          description: Tenant transferred
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BedWithTenant"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    Admin:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        name:
          type: string
      required:
        - id
        - email
        - name

    AdminLoginInput:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
      required:
        - email
        - password

    AdminLoginResult:
      type: object
      properties:
        token:
          type: string
        admin:
          $ref: "#/components/schemas/Admin"
      required:
        - token
        - admin

    Registration:
      type: object
      properties:
        id:
          type: integer
        fullName:
          type: string
        mobileNumber:
          type: string
        dateOfBirth:
          type: string
          format: date
        email:
          type: ["string", "null"]
        gender:
          type: string
          enum: [female, male, other]
        profession:
          type: string
        guardianName:
          type: string
        guardianMobile:
          type: string
        address:
          type: string
        notes:
          type: ["string", "null"]
        photoUrl:
          type: ["string", "null"]
        idProofUrl:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, approved, rejected]
        joiningDate:
          type: ["string", "null"]
          format: date
        paymentStatus:
          type: ["string", "null"]
          enum: [pending, paid, overdue, null]
        nextPaymentDate:
          type: ["string", "null"]
          format: date
        roomId:
          type: ["integer", "null"]
        bedId:
          type: ["integer", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - fullName
        - mobileNumber
        - dateOfBirth
        - gender
        - profession
        - guardianName
        - guardianMobile
        - address
        - status
        - createdAt
        - updatedAt

    RegistrationInput:
      type: object
      properties:
        fullName:
          type: string
          minLength: 2
        mobileNumber:
          type: string
          minLength: 10
        dateOfBirth:
          type: string
          format: date
        email:
          type: string
          format: email
        gender:
          type: string
          enum: [female, male, other]
        profession:
          type: string
          minLength: 2
        guardianName:
          type: string
          minLength: 2
        guardianMobile:
          type: string
          minLength: 10
        address:
          type: string
          minLength: 10
        notes:
          type: string
        photoUrl:
          type: string
        idProofUrl:
          type: string
      required:
        - fullName
        - mobileNumber
        - dateOfBirth
        - gender
        - profession
        - guardianName
        - guardianMobile
        - address

    RegistrationList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Registration"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        totalPages:
          type: integer
      required:
        - data
        - total
        - page
        - limit
        - totalPages

    StatusUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [approved, rejected]
      required:
        - status

    PaymentStatusUpdate:
      type: object
      properties:
        paymentStatus:
          type: string
          enum: [pending, paid, overdue]
      required:
        - paymentStatus

    RegistrationStats:
      type: object
      properties:
        total:
          type: integer
        pending:
          type: integer
        approved:
          type: integer
        rejected:
          type: integer
        todayCount:
          type: integer
        thisWeekCount:
          type: integer
        thisMonthCount:
          type: integer
      required:
        - total
        - pending
        - approved
        - rejected
        - todayCount
        - thisWeekCount
        - thisMonthCount

    FileUploadInput:
      type: object
      properties:
        type:
          type: string
          enum: [photo, idProof]
      required:
        - type

    FileUploadResult:
      type: object
      properties:
        url:
          type: string
        filename:
          type: string
      required:
        - url
        - filename

    QrCodeResult:
      type: object
      properties:
        qrCode:
          type: string
          description: Base64-encoded PNG of the QR code
        registrationUrl:
          type: string
      required:
        - qrCode
        - registrationUrl

    TenantSummary:
      type: object
      properties:
        id:
          type: integer
        fullName:
          type: string
        mobileNumber:
          type: string
        email:
          type: ["string", "null"]
        joiningDate:
          type: ["string", "null"]
          format: date
        nextPaymentDate:
          type: ["string", "null"]
          format: date
        paymentStatus:
          type: ["string", "null"]
      required:
        - id
        - fullName
        - mobileNumber

    BedWithTenant:
      type: object
      properties:
        id:
          type: integer
        roomId:
          type: integer
        bedNumber:
          type: integer
        status:
          type: string
          enum: [vacant, occupied]
        tenant:
          oneOf:
            - $ref: "#/components/schemas/TenantSummary"
            - type: "null"
      required:
        - id
        - roomId
        - bedNumber
        - status

    RoomWithBeds:
      type: object
      properties:
        id:
          type: integer
        roomNumber:
          type: integer
        totalBeds:
          type: integer
        occupiedBeds:
          type: integer
        availableBeds:
          type: integer
        beds:
          type: array
          items:
            $ref: "#/components/schemas/BedWithTenant"
      required:
        - id
        - roomNumber
        - totalBeds
        - occupiedBeds
        - availableBeds
        - beds

    RoomOccupancyStats:
      type: object
      properties:
        totalRooms:
          type: integer
        totalBeds:
          type: integer
        occupiedBeds:
          type: integer
        vacantBeds:
          type: integer
        occupancyPercentage:
          type: number
      required:
        - totalRooms
        - totalBeds
        - occupiedBeds
        - vacantBeds
        - occupancyPercentage

    CreateRoomInput:
      type: object
      properties:
        roomNumber:
          type: integer
          minimum: 1
        totalBeds:
          type: integer
          minimum: 1
      required:
        - roomNumber
        - totalBeds

    AssignBedInput:
      type: object
      properties:
        tenantId:
          type: integer
        joiningDate:
          type: string
          format: date
      required:
        - tenantId

    TransferBedInput:
      type: object
      properties:
        newBedId:
          type: integer
      required:
        - newBedId

    ReminderItem:
      type: object
      properties:
        id:
          type: integer
        fullName:
          type: string
        mobileNumber:
          type: string
        email:
          type: ["string", "null"]
        joiningDate:
          type: ["string", "null"]
        nextPaymentDate:
          type: ["string", "null"]
        paymentStatus:
          type: ["string", "null"]
        daysUntilDue:
          type: integer
      required:
        - id
        - fullName
        - mobileNumber
        - daysUntilDue

    RemindersResponse:
      type: object
      properties:
        today:
          type: array
          items:
            $ref: "#/components/schemas/ReminderItem"
        upcoming:
          type: array
          items:
            $ref: "#/components/schemas/ReminderItem"
        overdue:
          type: array
          items:
            $ref: "#/components/schemas/ReminderItem"
      required:
        - today
        - upcoming
        - overdue
